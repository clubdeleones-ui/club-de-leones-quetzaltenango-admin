
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club de Leones Quetzaltenango</title>
  
  <!-- Open Graph / WhatsApp / Facebook Preview Tags -->
  <meta property="og:title" content="Club de Leones Quetzaltenango • Actividades Oficiales">
  <meta property="og:description" content="Conoce las actividades, eventos, proyectos comunitarios y reserva de salón del Club de Leones Quetzaltenango.">
  <meta property="og:image" content="https://clubdeleonesquetzaltenango.org/images/logo.png">
  <meta property="og:url" content="https://clubdeleonesquetzaltenango.org/">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <script>
    (function() {
      var h = window.location.hostname;
      if (h.includes('web.app') || h.includes('firebaseapp.com')) {
        window.location.replace('https://clubdeleonesquetzaltenango.org' + window.location.pathname + window.location.search + window.location.hash);
      }
    })();

    // Suprimir advertencias asíncronas generadas por extensiones del navegador (Chrome Extensions)
    window.addEventListener('unhandledrejection', function(event) {
      var reason = event.reason;
      var msg = (reason && (reason.message || (typeof reason === 'string' ? reason : ''))) || '';
      if (
        msg.indexOf('message channel closed before a response was received') !== -1 ||
        msg.indexOf('A listener indicated an asynchronous response') !== -1
      ) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="./images/logo.png">
</head>

</body>
</html>
